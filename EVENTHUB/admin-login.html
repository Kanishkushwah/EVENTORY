<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Eventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    
        /* =============== PREMIUM AESTHETICS =============== */
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; }
        
        ::selection { background: rgba(139, 92, 246, 0.3); color: inherit; }

        /* Glassmorphism Navbar */
        nav {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.75) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
        }
        .dark nav {
            background-color: rgba(17, 24, 39, 0.75) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        /* Smooth Interactive Elements */
        button, a, .card, .cinema-card, .date-btn, .showtime-btn, input, select {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Bouncy Button Hover */
        button:hover, a.nav-link:hover, .hover\:-translate-y-1:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0) scale(0.98);
        }

        /* Input Focus Glow */
        input:focus, select:focus, textarea:focus {
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15) !important;
            border-color: #8B5CF6 !important;
        }

        /* Soft Card Shadows */
        .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl {
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08) !important;
        }
        .dark .shadow-sm, .dark .shadow, .dark .shadow-md, .dark .shadow-lg, .dark .shadow-xl {
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3) !important;
        }
        
        /* ================================================= */

    
    /* =============== ULTRA PREMIUM AESTHETICS =============== */
    /* Custom Modern Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.6);
    }
    .dark ::-webkit-scrollbar-thumb {
        background: rgba(167, 139, 250, 0.3);
    }
    .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(167, 139, 250, 0.6);
    }

    /* Floating Image Animation for Hero/Feature elements */
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }
    .animate-float {
        animation: float 6s ease-in-out infinite;
    }

    /* Scroll Reveal Animation */
    .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
    }
    .reveal.active {
        opacity: 1;
        transform: translateY(0);
    }

    /* Glass Panels */
    .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .dark .glass-panel {
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Glowing badge */
    .glow-badge {
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }
    /* ======================================================= */

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-purple-50 to-indigo-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <span class="material-icons-outlined text-purple-600 text-5xl">admin_panel_settings</span>
            <h1 class="text-3xl font-bold mt-4 text-gray-900">Admin Login</h1>
            <p class="text-gray-600 mt-2">Sign in to access your dashboard</p>
        </div>

        <form onsubmit="loginAdmin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <input type="email" id="admin-email" required
                    class="w-full px-4 py-3 border- rounded-lg border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="admin@example.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="admin-password" required
                    class="w-full px-4 py-3 rounded-lg border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition shadow-lg">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="Index.html" class="text-sm text-purple-600 hover:underline">← Back to Home</a>
        </div>
    </div>

    <script>
        async function loginAdmin(event) {
            event.preventDefault();

            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminEmail', email);
                    window.location.href = 'admin-dashboard.html';
                } else {
                    alert('Invalid credentials. Please try again.');
                }

            } catch (err) {
                console.error('Login error:', err);
                alert('Login failed. Please check your connection.');
            }
        }

        // Redirect if already logged in
        if (localStorage.getItem('adminLoggedIn')) {
            window.location.href = 'admin-dashboard.html';
        }
    </script>


    


    <!-- Scroll Reveal Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply reveal class to all major container elements dynamically if not present
            const revealElements = document.querySelectorAll('.card, .cinema-card, h1, h2, h3, .glass-panel');
            revealElements.forEach(el => {
                if(!el.classList.contains('reveal') && !el.closest('nav') && !el.closest('#mobile-menu')) {
                    el.classList.add('reveal');
                }
            });

            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
            });
            
            // Trigger immediately for elements in viewport on load
            setTimeout(()=> {
                document.querySelectorAll('.reveal').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if(rect.top < window.innerHeight) {
                        el.classList.add('active');
                    }
                });
            }, 100);
        });
    </script>

</body>

</html>
