<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Eventory - Upcoming Releases</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6B46C1",
                        secondary: "#805AD5",
                        "background-light": "#F7FAFC",
                        "background-dark": "#1A202C",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#2D3748",
                    },
                    fontFamily: {
                        body: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        .page-enter {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-body page-enter">

    <!-- NAVBAR (Same structure as index.html simplified) -->
    <nav class="bg-surface-light dark:bg-surface-dark shadow-sm py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 md:px-8 flex items-center justify-between">
            <a class="text-2xl font-bold text-primary tracking-tight flex items-center gap-2"
                href="index.html">Eventory</a>
            <div class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-600 dark:text-gray-300">
                <a class="flex items-center hover:text-primary transition-colors gap-1" href="index.html"><span
                        class="material-icons text-lg">home</span> Browse Events</a>
                <a class="text-primary border-b-2 border-primary pb-1 flex items-center gap-1"
                    href="releases.html"><span class="material-icons text-lg">new_releases</span> Releases</a>
                <a class="flex items-center hover:text-primary transition-colors gap-1" href="user-profile.html"><span
                        class="material-icons text-lg">confirmation_number</span> My Bookings</a>
            </div>
            <div class="hidden md:flex items-center space-x-4">
                <a href="login.html" class="text-gray-600 dark:text-gray-300 hover:text-primary">Login</a>
                <a href="register.html"
                    class="bg-primary hover:bg-purple-700 text-white px-4 py-2 rounded-lg font-bold">Register</a>
            </div>
            <button class="md:hidden text-gray-800 dark:text-white"
                onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                <span class="material-icons">menu</span>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-gray-900 border-b p-4">
        <a href="index.html" class="block py-2">Home</a>
        <a href="releases.html" class="block py-2 text-primary font-bold">Releases</a>
        <a href="login.html" class="block py-2">Login</a>
    </div>

    <!-- MAIN RELEASES CONTENT -->
    <main class="flex-grow container mx-auto px-4 py-16 max-w-7xl">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-black text-gray-900 dark:text-white mb-4 tracking-tight">Coming Soon To
                Theaters</h1>
            <p class="text-gray-500 dark:text-gray-400 font-medium text-lg max-w-2xl mx-auto">Get hyped for the biggest
                upcoming blockbusters. Set notifications so you don't miss opening day tickets!</p>
        </div>

        <!-- RELEASES GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8"
            id="releasesGrid">
            <!-- Loading Skeleton -->
            <div class="animate-pulse bg-gray-200 dark:bg-gray-800 rounded-2xl h-80 w-full mb-4"></div>
            <div class="animate-pulse bg-gray-200 dark:bg-gray-800 rounded-2xl h-80 w-full mb-4 hidden sm:block"></div>
            <div class="animate-pulse bg-gray-200 dark:bg-gray-800 rounded-2xl h-80 w-full mb-4 hidden md:block"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-white py-8 text-center mt-auto">
        <p class="text-sm text-gray-400">© 2026 Eventory. All rights reserved.</p>
    </footer>

    <script>
        async function loadReleases() {
            const grid = document.getElementById("releasesGrid");
            try {
                // Fetch dynamic releases config from Admin Setting
                const res = await fetch('/api/config');
                if (!res.ok) throw new Error("Failed to fetch");
                const config = await res.json();
                const releases = config.releases || [];

                grid.innerHTML = "";

                if (releases.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20"><p class="text-gray-500">No upcoming releases at the moment.</p></div>`;
                    return;
                }

                releases.forEach((r, index) => {
                    const animDelay = index * 100;
                    grid.innerHTML += `
                        <div class="group cursor-pointer flex flex-col" style="animation: fadeIn 0.5s ease-out ${animDelay}ms both;">
                            <!-- Premium Aspect Ratio Poster -->
                            <div class="overflow-hidden rounded-2xl shadow-xl shadow-purple-900/10 mb-5 relative aspect-[2/3] w-full">
                                <img src="${r.image}" class="w-full h-full object-cover transform duration-700 ease-out group-hover:scale-110" onerror="this.src='https://via.placeholder.com/400x600?text=Poster+Unavailable'"/>
                                <!-- Glassmorphic Overlay -->
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/0 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end items-center pb-6">
                                    <button class="bg-white/20 hover:bg-white text-white hover:text-primary backdrop-blur-md border border-white/40 font-bold px-6 py-2.5 rounded-full text-sm transition-all transform hover:scale-105 flex items-center gap-2 shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                                        <span class="material-icons-outlined text-[18px]">notifications_active</span> Notify Me
                                    </button>
                                </div>
                            </div>
                            <!-- Details -->
                            <h3 class="text-center font-bold text-gray-900 dark:text-white text-lg tracking-tight mb-1 group-hover:text-primary transition-colors">${r.title}</h3>
                            <p class="text-center text-sm font-medium text-purple-600 dark:text-purple-400 uppercase tracking-widest text-[11px]">${r.genre}</p>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Failed to load releases", e);
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500">Failed to load releases.</div>`;
            }
        }

        loadReleases();
    </script>
</body>

</html>
