<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Successful - Eventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="text-center max-w-md mx-auto p-8">
        <div class="mb-6">
            <svg class="w-20 h-20 text-green-500 mx-auto animate-bounce" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-3">✓ Login Successful!</h1>
        <p id="welcome-msg" class="text-xl text-purple-600 font-semibold mb-6"></p>
        <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto mb-3"></div>
            <p class="text-sm text-purple-800 font-medium">Redirecting to dashboard...</p>
        </div>
    </div>

    <script>
        console.log('Auth success page loaded on:', window.location.origin);

        // Get user data from URL parameters
        const urlParams = new URLSearchParams(window.location.search);

        const userData = {
            id: urlParams.get('id'),
            email: urlParams.get('email'),
            name: urlParams.get('name'),
            profilePicture: urlParams.get('profilePicture'),
            loginMethod: urlParams.get('loginMethod') || 'google'
        };

        console.log('User data received:', userData);

        // Display welcome message
        if (userData.name) {
            document.getElementById('welcome-msg').textContent = `Welcome, ${userData.name}!`;
        }

        // Validate we have required data
        if (!userData.email || !userData.name) {
            console.error('Missing required user data');
            setTimeout(() => {
                window.location.href = '/EVENTHUB/login.html?error=missing_data';
            }, 2000);
        } else {
            // Store in localStorage (same origin as dashboard now!)
            try {
                localStorage.setItem('loggedInUser', JSON.stringify(userData));
                console.log('✓ User data stored in localStorage on origin:', window.location.origin);
                console.log('✓ Stored data:', localStorage.getItem('loggedInUser'));

                // Redirect to dashboard after 1.5 seconds
                setTimeout(() => {
                    console.log('Redirecting to dashboard...');
                    window.location.href = '/EVENTHUB/user-dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('Failed to store user data:', err);
                alert('Login successful but failed to save session. Please try again.');
                setTimeout(() => {
                    window.location.href = '/EVENTHUB/login.html';
                }, 2000);
            }
        }
    </script>

    


    <!-- Scroll Reveal Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply reveal class to all major container elements dynamically if not present
            const revealElements = document.querySelectorAll('.card, .cinema-card, h1, h2, h3, .glass-panel');
            revealElements.forEach(el => {
                if(!el.classList.contains('reveal') && !el.closest('nav') && !el.closest('#mobile-menu')) {
                    el.classList.add('reveal');
                }
            });

            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
            });
            
            // Trigger immediately for elements in viewport on load
            setTimeout(()=> {
                document.querySelectorAll('.reveal').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if(rect.top < window.innerHeight) {
                        el.classList.add('active');
                    }
                });
            }, 100);
        });
    </script>


<!-- PREMIUM CURSOR EFFECTS -->
<div id="custom-cursor-blob" class="hidden md:block pointer-events-none"></div>
<div id="custom-cursor-dot" class="hidden md:block pointer-events-none"></div>
<style>
    /* Premium Cursor Glowing Blob */
    #custom-cursor-blob {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, rgba(0,0,0,0) 70%);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: transform 0.1s ease-out;
        mix-blend-mode: screen;
        top: 0;
        left: 0;
    }
    .dark #custom-cursor-blob {
        background: radial-gradient(circle, rgba(167,139,250,0.2) 0%, rgba(0,0,0,0) 70%);
    }
    #custom-cursor-dot {
        width: 8px;
        height: 8px;
        background: rgba(139,92,246, 0.8);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px rgba(139,92,246, 0.8);
        top: 0;
        left: 0;
        transition: width 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                    height 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                    background 0.2s, 
                    border 0.2s;
    }
    
    /* Ensure native cursor is present but un-styled */
    body {
        cursor: default;
    }
    a, button, input, .cursor-pointer {
        cursor: pointer;
    }
</style>
<script>
    if (window.innerWidth > 768) {
        const blob = document.getElementById("custom-cursor-blob");
        const dot = document.getElementById("custom-cursor-dot");
        let mouseX = 0, mouseY = 0, blobX = 0, blobY = 0;
        
        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            dot.style.left = mouseX + "px";
            dot.style.top = mouseY + "px";
        });
        
        function animateBlob() {
            blobX += (mouseX - blobX) * 0.1;
            blobY += (mouseY - blobY) * 0.1;
            blob.style.left = blobX + "px";
            blob.style.top = blobY + "px";
            requestAnimationFrame(animateBlob);
        }
        animateBlob();

        // Observe DOM for hover states
        const applyHoverEffect = () => {
            document.querySelectorAll('a, button, input, select, .cursor-pointer, .tilt-card').forEach(el => {
                if (el.dataset.cursorBound) return;
                el.dataset.cursorBound = "true";
                el.addEventListener('mouseenter', () => {
                    dot.style.width = '40px';
                    dot.style.height = '40px';
                    dot.style.background = 'rgba(139,92,246, 0.1)';
                    dot.style.border = '2px solid rgba(139,92,246, 0.8)';
                });
                el.addEventListener('mouseleave', () => {
                    dot.style.width = '8px';
                    dot.style.height = '8px';
                    dot.style.background = 'rgba(139,92,246, 0.8)';
                    dot.style.border = 'none';
                });
            });
        };
        
        applyHoverEffect();
        const cursorObserver = new MutationObserver(applyHoverEffect);
        cursorObserver.observe(document.body, { childList: true, subtree: true });
    }
</script>
<!-- END PREMIUM CURSOR -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tiltOptions = {
            max: 5,
            speed: 400,
            glare: true,
            "max-glare": 0.15,
            scale: 1.02
        };
        
        VanillaTilt.init(document.querySelectorAll(".glass-panel, .cinema-card"), tiltOptions);
        
        // Function to initialize tilt on cards
        const initTilt = () => {
            const cards = document.querySelectorAll('#eventGrid > div, #cinema-grid > div');
            cards.forEach(card => {
                if (!card.vanillaTilt) {
                    card.classList.add('tilt-card');
                    VanillaTilt.init(card, tiltOptions);
                }
            });
        };
        
        initTilt();
        
        // Add tilt-card to dynamically generated events
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.addedNodes.length) {
                    initTilt();
                }
            });
        });
        
        const eventGrid = document.getElementById('eventGrid');
        const cinemaGrid = document.getElementById('cinema-grid');
        if (eventGrid) observer.observe(eventGrid, { childList: true });
        if (cinemaGrid) observer.observe(cinemaGrid, { childList: true });
    });
</script>

</body>

</html>
